<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Build ready-to-paste agent prompts from toggles and workflows. Everything stays in your browser." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>promptdraw</title>
    <script>
      // Apply the saved theme before first paint so there is no flash of the wrong one.
      try {
        var m = localStorage.getItem("promptdraw:theme");
        if (m === "light" || m === "dark") document.documentElement.setAttribute("data-theme", m);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
